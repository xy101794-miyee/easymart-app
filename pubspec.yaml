name: easymart

description: A complete Flutter grocery shopping app with SQLite, customer and admin flows.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.6.4
  shared_preferences: ^2.1.0
  intl: ^0.19.0
  crypto: ^3.1.0
  flutter_svg: ^2.0.10


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

